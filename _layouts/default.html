<!doctype html>
<html lang="en">

<head>

  <!-- ========================================================
       THE GIRL IN 3C — GLOBAL PAGE SETTINGS
       ======================================================== -->

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <title>
    {% if page.title %}
      {{ page.title }} ·
    {% endif %}
    {{ site.title }}
  </title>


  <!-- ========================================================
       MAIN STYLESHEET

       All visual styling lives in:
       /assets/css/style.css
       ======================================================== -->

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >


  <!-- ========================================================
       FAVICON

       If favicon.png does not exist yet, this simply won't
       display a favicon. It will not affect the website.
       ======================================================== -->

  <link
    rel="icon"
    type="image/png"
    href="{{ '/assets/images/favicon.png' | relative_url }}"
  >

</head>


<body>


  <!-- ========================================================
       HEADER

       This appears ONCE on every page.
       ======================================================== -->

  <header class="site-header">

    <div class="header-inner">


      <!-- BRAND -->

      <a
        class="brand"
        href="{{ '/' | relative_url }}"
        aria-label="The Girl in 3C — Home"
      >

        <span class="brand-mark">
          3C
        </span>

        <span class="brand-name">
          THE GIRL IN 3C
        </span>

      </a>


      <!-- NAVIGATION -->

      <nav
        class="site-nav"
        aria-label="Main navigation"
      >

        <a href="{{ '/' | relative_url }}">
          Home
        </a>

        <a href="{{ '/stories/' | relative_url }}">
          Stories
        </a>

        <a href="{{ '/about/' | relative_url }}">
          About
        </a>

        <a
          class="nav-subscribe"
          href="{{ '/subscribe/' | relative_url }}"
        >
          Subscribe
        </a>

      </nav>

    </div>

  </header>



  <!-- ========================================================
       MAIN CONTENT

       Jekyll inserts the current page here.

       Homepage → index.html
       About → pages/about.html
       Stories → pages/stories.html
       Article → _posts/*.md
       ======================================================== -->

  <main>

    {{ content }}

  </main>



  <!-- ========================================================
       FOOTER

       This appears ONCE on every page.
       ======================================================== -->

  <footer class="site-footer">

    <div class="footer-brand">

      <p class="brand-name">
        THE GIRL IN 3C
      </p>

      <p>
        New York. Love. Bad decisions.
        Everything in between.
      </p>

    </div>


    <div class="footer-links">

      <a href="{{ '/about/' | relative_url }}">
        About
      </a>

      <a href="{{ '/subscribe/' | relative_url }}">
        Subscribe
      </a>

      <a
        href="https://www.instagram.com/thegirlin3c/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

    </div>

  </footer>


</body>

</html>

</html>
